# OpenDrawer - configuration globale
# Les options de la ligne de commande remplacent ces valeurs pour une exécution.

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative

generation:
  backend: auto                  # auto | diffusers | comfyui | opencv
  family: auto                   # auto | sdxl | sd15  (auto = SDXL dès qu'un GPU est présent)
  style: livre-jeunesse          # fichier styles/<nom>.yaml
  candidates: 3                  # nombre de propositions de cartoon par photo
  identity: auto                 # auto | faceid | plus_face | none
  seed: null                     # null = aléatoire

coloring:
  difficulty: medium             # easy/facile | medium/moyen | hard/difficile
  color_source: photo            # photo = couleurs réelles de la photo | cartoon

page:
  paper: A4                      # A4 portrait
  dpi: 300
  margin_mm: 10
  thumbnail_ratio: 0.26          # largeur de la vignette colorée / largeur utile

licensing:
  commercial_safe: false         # true = uniquement des modèles à licence permissive
